name = "line-harness"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# ═══════════════════════════════════════════════════════════════
# ゆる麻布 本番 (fork運用 / prod ブランチ)
# 使い方: pnpm --filter worker build && npx wrangler deploy
#
# upstream ではここはテスト環境用のプレースホルダだが、この fork の
# prod ブランチには本番の実値を入れている。デプロイ済み Worker と
# 完全一致させること (差分はそのまま本番の挙動変化になる)。
#   - 本番には plain-text vars が1つも無いので [vars] は置かない
#     (self-update route は vars 不在で不活性。upstream の設計どおり)
#   - workers_dev = true は必須。旧ホスト line-harness.yuruazabu.workers.dev
#     を配布済リンクと保存済み画像の絶対URLが参照しているため落とせない
#   - custom domain は明示宣言する
# ═══════════════════════════════════════════════════════════════
account_id = "f4b835c4e96eeb8304c00439531ba751"

routes = [
  { pattern = "line.yuruazabu.net", custom_domain = true }
]

[assets]
directory = "dist/client"
binding = "ASSETS"
# Worker を先に走らせて bot UA → OGP HTML 差し込みを可能にする。
# 通常 UA のときは Worker の notFound 内で c.env.ASSETS.fetch(req) を呼んで
# SPA を返す。これが無いと static asset path が Worker をバイパスして
# 直接配信され、bot 判定が効かない。
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "line-harness"
# 既存の本番 D1。デプロイ済み Worker の env.DB と同一 ID であること
database_id = "20e8f65c-effa-4b37-8c3d-56928986be9b"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "line-harness-images"

[triggers]
crons = ["*/5 * * * *", "0 */6 * * *"]

# ═══════════════════════════════════════════════════════════════
# Phase 5 self-update vars — consumed by /admin/update/*. Secrets
# (CF_API_TOKEN, ADMIN_API_KEY) must be set via `wrangler secret put`
# and are intentionally absent from this file.
# 注: [env.production] には意図的に置かない。本番は GitHub Actions デプロイ
# 運用のため self-update は使わず、vars/secrets 不在で route は実行時ガードで
# 不活性になる (本番挙動を変えないための判断, 2026-07-07)。
# ═══════════════════════════════════════════════════════════════
# ゆる麻布本番では [vars] を意図的に空にしている。
# デプロイ済み Worker には plain-text var が1つも無く (wrangler versions view で確認)、
# ここで vars を足すと本番の挙動が変わるため。self-update route は
# vars 不在のまま実行時ガードで不活性になる (upstream の設計どおり)。

# ═══════════════════════════════════════════════════════════════
# 本番環境
# 使い方: npx wrangler deploy --env production --name your-worker-name
# D1:     npx wrangler d1 execute your-database --env production --remote --file ...
# ═══════════════════════════════════════════════════════════════
[env.production]
account_id = "YOUR_ACCOUNT_ID"
compatibility_flags = ["nodejs_compat"]

[env.production.assets]
directory = "dist/client"
binding = "ASSETS"
run_worker_first = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "line-crm"
database_id = "YOUR_D1_DATABASE_ID"

[[env.production.r2_buckets]]
binding = "IMAGES"
bucket_name = "line-harness-images"

[env.production.triggers]
crons = ["*/5 * * * *", "0 */6 * * *"]

# ═══════════════════════════════════════════════════════════════
# ゆる麻布ラウンジ / salonkit連携インスタンス（fork運用・2026-07-30〜）
#
# 使い方:
#   CLOUDFLARE_ENV=yurul pnpm --filter worker build
#   npx wrangler deploy --env yurul
#
# デプロイ済み Worker の実測値と完全一致させること（wrangler versions view で確認）。
# 環境ブロックは非継承キーを全部書く必要がある（name / assets / d1 / r2 / triggers / vars）。
#   - name を省略すると line-harness-yurul になってしまうので必須
#   - vars はこちらも本番に1つも無いので置かない
#   - カスタムドメインは無し（workers.dev のみ）
# ═══════════════════════════════════════════════════════════════
[env.yurul]
name = "line"
account_id = "ec960401855b592380bfc8588c7b5faf"
workers_dev = true
compatibility_flags = ["nodejs_compat"]
# routes を空で明示上書きするのは必須。
# 省略するとトップレベルの routes（ゆる麻布の custom domain line.yuruazabu.net）が
# この環境に継承され、デプロイでゆる麻布のドメインをラウンジ Worker に付け替えてしまう。
# 2026-07-30 に生成設定を確認して発覚。ラウンジは workers.dev のみで運用。
routes = []

[env.yurul.assets]
directory = "dist/client"
binding = "ASSETS"
run_worker_first = true

[[env.yurul.d1_databases]]
binding = "DB"
database_name = "line"
database_id = "cb49c8f7-49e5-4034-8759-d22372421ea6"

[[env.yurul.r2_buckets]]
binding = "IMAGES"
bucket_name = "line-images"

[env.yurul.triggers]
crons = ["*/5 * * * *", "0 */6 * * *"]

# ═══════════════════════════════════════════════════════════════
# hataraki / line.hataraki-joshi.com インスタンス（fork運用・2026-08-10〜）
#
# 使い方:
#   CLOUDFLARE_ENV=hataraki pnpm --filter worker build
#   npx wrangler deploy --env hataraki
#
# Cloudflare アカウントは X, Inc.（hataraki-joshi.com のゾーンがここにあるため。
# Custom Domain は Worker と同一アカウント必須）。
# 環境ブロックは非継承キーを全部書く必要がある（name / assets / d1 / r2 / triggers）。
#   - vars は他環境と同じく置かない（self-update route を不活性に保つ）
#   - routes はこの環境の custom domain を明示。省略するとトップレベルの
#     ゆる麻布ドメインを継承して奪ってしまう（yurul と同じ落とし穴）
# ═══════════════════════════════════════════════════════════════
[env.hataraki]
name = "line-hataraki"
account_id = "224b353bf179e83ea2ed688601a5bcce"
workers_dev = true
compatibility_flags = ["nodejs_compat"]
routes = [
  { pattern = "line.hataraki-joshi.com", custom_domain = true }
]

[env.hataraki.assets]
directory = "dist/client"
binding = "ASSETS"
run_worker_first = true

[[env.hataraki.d1_databases]]
binding = "DB"
database_name = "line-hataraki"
database_id = "112deee0-2134-4f29-8345-33419ea39248"

[[env.hataraki.r2_buckets]]
binding = "IMAGES"
bucket_name = "line-hataraki-images"

[env.hataraki.triggers]
crons = ["*/5 * * * *", "0 */6 * * *"]
